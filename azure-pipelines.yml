trigger:
  branches:
    include:
      - '*'

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: Maven@3
    displayName: 'Build and verify application'
    inputs:
      mavenPomFile: 'pom.xml'
      goals: 'clean verify'
      publishJUnitResults: true
      testResultsFiles: '**/surefire-reports/TEST-*.xml'

  - task: Docker@2
    inputs:
      command: 'buildAndPush'
      repository: 'ssp/menu-service'
      dockerfile: 'Dockerfile'
      containerRegistry: 'ssp-acr-connection'
      tags: 'latest'

  - task: AzureWebApp@1
    inputs:
      azureSubscription: 'ssp-azure-connection'
      appName: 'ssp-menu-service-prod'
      containers: 'sspacr.azurecr.io/ssp/menu-service:latest'
